openapi: 3.0.3
info:
  title: Notifications API
  description: |
    Accepts notification requests (email, SMS, push) and queues them for
    asynchronous delivery. Responses with status `pending` mean the
    notification was accepted, not delivered; delivery happens in workers.
  version: 0.1.0

servers:
  - url: /api/v1

paths:
  /notifications:
    post:
      summary: Send a notification
      operationId: sendNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
      responses:
        "202":
          description: Notification accepted for asynchronous delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/InternalError"

  /notifications/batch:
    post:
      summary: Send multiple notifications
      description: |
        Items are processed independently: the response reports a result
        per item, so a batch can partially succeed.
      operationId: sendNotificationBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationBatchRequest"
      responses:
        "202":
          description: Batch processed; see per-item results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendNotificationBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/InternalError"

  /templates:
    get:
      summary: List available templates
      operationId: listTemplates
      parameters:
        - name: type
          in: query
          required: false
          description: Only return templates for this notification type.
          schema:
            $ref: "#/components/schemas/NotificationType"
      responses:
        "200":
          description: Available templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        default:
          $ref: "#/components/responses/InternalError"

  /templates/{type}/{id}:
    get:
      summary: Get template details
      description: |
        Template IDs are scoped by notification type: "default" exists
        independently for every channel.
      operationId: getTemplate
      parameters:
        - name: type
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/NotificationType"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Template details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/InternalError"

components:
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    NotificationType:
      type: string
      description: Notification delivery channel.
      enum: [email, sms, push]

    NotificationPriority:
      type: string
      description: |
        Queue lane selection. Defaults to `transactional`. Bulk senders
        (campaigns) must set `bulk` so they never delay transactional
        notifications such as OTPs or password resets.
      enum: [transactional, bulk]
      default: transactional

    Recipient:
      type: object
      description: |
        Delivery address. Exactly the field matching the notification
        type must be set: `email` for email, `phone_number` for sms,
        `device_token` for push.
      properties:
        email:
          type: string
          description: Email address (RFC 5322) for email notifications.
          example: anna.kowalska@example.com
        phone_number:
          type: string
          description: Phone number (E.164) for SMS notifications.
          example: "+48601234567"
        device_token:
          type: string
          description: FCM/APNs device token for push notifications.
        user_id:
          type: string
          description: Optional reference to the receiving user.
          example: user_789

    SendNotificationRequest:
      type: object
      required: [type, recipient]
      properties:
        type:
          $ref: "#/components/schemas/NotificationType"
        priority:
          $ref: "#/components/schemas/NotificationPriority"
        recipient:
          $ref: "#/components/schemas/Recipient"
        template_id:
          type: string
          description: |
            Template to render at delivery time. Omit to use the default
            template for the notification type.
          example: welcome
        template_data:
          type: object
          additionalProperties: true
          description: Values substituted into the template.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Opaque key-value pairs carried with the notification.

    NotificationAccepted:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: string
          description: Notification identifier for tracking.
        status:
          type: string
          enum: [pending]
          description: Always `pending` — delivery is asynchronous.
        created_at:
          type: string
          format: date-time

    SendNotificationBatchRequest:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SendNotificationRequest"

    BatchItemResult:
      type: object
      description: Exactly one of `notification` or `error` is set.
      required: [index]
      properties:
        index:
          type: integer
          description: Position of the item in the request array.
        notification:
          $ref: "#/components/schemas/NotificationAccepted"
        error:
          $ref: "#/components/schemas/ErrorResponse"

    SendNotificationBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BatchItemResult"

    TemplateSummary:
      type: object
      required: [id, type, name, is_default]
      properties:
        id:
          type: string
          example: welcome
        type:
          $ref: "#/components/schemas/NotificationType"
        name:
          type: string
          example: Welcome Email
        is_default:
          type: boolean
          description: Whether this is the default template for its type.

    Template:
      type: object
      required: [id, type, name, is_default, subject, body]
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/NotificationType"
        name:
          type: string
        is_default:
          type: boolean
        subject:
          type: string
          description: Go template for the email subject or push title.
        body:
          type: string
          description: Go template for the body.

    TemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/TemplateSummary"

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Machine-readable error class: `validation_error`,
            `template_not_found`, `bad_request`, `not_found`,
            `internal_error`.
        message:
          type: string
        field:
          type: string
          description: The invalid input field, for validation errors.
          example: recipient.email

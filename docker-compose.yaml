services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: notifications-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: notifications-api
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      LOG_LEVEL: "info"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker-email:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: notifications-worker-email
    environment:
      WORKER_TYPE: "email"
      WORKER_CONCURRENCY: "10"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      LOG_LEVEL: "info"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker-sms:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: notifications-worker-sms
    environment:
      WORKER_TYPE: "sms"
      WORKER_CONCURRENCY: "10"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      LOG_LEVEL: "info"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker-push:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: notifications-worker-push
    environment:
      WORKER_TYPE: "push"
      WORKER_CONCURRENCY: "10"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      LOG_LEVEL: "info"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbitmq_data:

# Shared base for the per-lane workers. One process serves one
# <type>.<priority> lane, so transactional lanes never share capacity
# with bulk. Scale a lane with `docker compose up --scale worker-...=N`.
x-worker: &worker
  build:
    context: .
    dockerfile: Dockerfile.worker
  environment: &worker-env
    RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    LOG_LEVEL: "info"
  depends_on:
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: notifications-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: notifications-api
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      LOG_LEVEL: "info"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker-email-transactional:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_TYPE: "email"
      WORKER_PRIORITY: "transactional"

  worker-email-bulk:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_TYPE: "email"
      WORKER_PRIORITY: "bulk"

  worker-sms-transactional:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_TYPE: "sms"
      WORKER_PRIORITY: "transactional"

  worker-sms-bulk:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_TYPE: "sms"
      WORKER_PRIORITY: "bulk"

  worker-push-transactional:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_TYPE: "push"
      WORKER_PRIORITY: "transactional"

  worker-push-bulk:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_TYPE: "push"
      WORKER_PRIORITY: "bulk"

volumes:
  rabbitmq_data:

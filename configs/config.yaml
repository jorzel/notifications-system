server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s

rabbitmq:
  url: amqp://guest:guest@localhost:5672/
  exchange: notifications
  queues:
    email: email_queue
    sms: sms_queue
    push: push_queue

worker:
  type: email
  concurrency: 10
  max_retries: 3
  retry_delays:
    - 1s
    - 5s
    - 30s

templates:
  path: ./configs/templates

log:
  level: info
  format: json
